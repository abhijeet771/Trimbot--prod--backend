version: '3.8'

services:
  db:
    image: mongo:latest
    container_name: trimtokyo-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: trimtokyo-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://db:27017/trimtokyo
      - CLIENT_URL=http://localhost:5173
      - JWT_SECRET=super_secret_session_token_trim_tokyo_98765
      - JWT_EXPIRES_IN=7d
      - AI_PROVIDER=openai
      - AI_MODEL_NAME=gpt-4o
    depends_on:
      - db
    volumes:
      - ./server/logs:/usr/src/app/logs

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: trimtokyo-client
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mongo-data:
